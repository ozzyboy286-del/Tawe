      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="140" y1="90" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Receipt Card -->
  <rect x="128" y="88" width="256" height="336" rx="28" fill="#FFFFFF" />
  <!-- Benin tricolor top bar on receipt -->
  <rect x="128" y="88" width="85" height="16" rx="4" fill="#16A34A" />
  <rect x="213" y="88" width="86" height="16" fill="#F59E0B" />
  <rect x="299" y="88" width="85" height="16" rx="4" fill="#DC2626" />
